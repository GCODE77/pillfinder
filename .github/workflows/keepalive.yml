# Supabase 무료 프로젝트는 7일간 활동이 없으면 일시정지된다 → 3일마다 공개 API를 한 번 읽어 깨운다.
# (공개 URL·publishable 키는 config.js와 같은 공개 값이라 Secret이 필요 없다)
name: keepalive
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:
permissions:
  contents: write   # 저장소가 60일 무활동으로 예약 실행이 꺼지는 것을 막는 빈 커밋용
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Supabase 깨우기
        run: |
          URL=$(grep -o "supabaseUrl: '[^']*'" config.js | cut -d"'" -f2)
          KEY=$(grep -o "anonKey: '[^']*'" config.js | cut -d"'" -f2)
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/confirmations?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
            echo "시도 $i: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "::error::Supabase가 응답하지 않습니다(정지됐을 수 있음: 대시보드에서 Restore)"; exit 1
      - name: 저장소 활동 유지(45일 넘게 커밋 없을 때만)
        run: |
          last=$(git log -1 --format=%ct); now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "keepalive"; git config user.email "keepalive@users.noreply.github.com"
            git commit --allow-empty -m "keepalive: 예약 실행 유지용 빈 커밋" && git push
          fi
